name: Server image

# Собирает Docker-образ сервера и публикует в GitHub Container Registry
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "server/**"
      - "sync-protocol/**"
      - "Dockerfile"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew"
      - ".github/workflows/server-image.yml"
  pull_request:
    paths:
      - "server/**"
      - "sync-protocol/**"
      - "Dockerfile"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KMP_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :server:test --console=plain

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kmp-music-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 — обычные ПК и серверы, arm64 — Raspberry Pi и некоторые NAS
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
